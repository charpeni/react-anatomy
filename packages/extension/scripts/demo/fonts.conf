<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>Google Sans Text</family><prefer><family>FreeSans</family></prefer></alias>
  <alias><family>Google Sans</family><prefer><family>FreeSans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>FreeSans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>FreeSans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>FreeSans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>FreeSans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>IBM Plex Mono</family></prefer></alias>
  <alias><family>Consolas</family><prefer><family>IBM Plex Mono</family></prefer></alias>
  <alias><family>Liberation Mono</family><prefer><family>IBM Plex Mono</family></prefer></alias>
</fontconfig>
